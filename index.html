<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrapJob | Job Vacancies</title>

    <meta
      name="description"
      content="ScrapJob is a fictional job portal created for web scraping practice."
    />

    <meta name="robots" content="index, follow" />

    <meta name="author" content="ScrapJob" />

    <meta
      name="keywords"
      content="jobs, job vacancies, employment, web scraping, scraping practice"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ScrapJob | Job Vacancies" />
    <meta
      property="og:description"
      content="A fictional job portal created for web scraping practice."
    />
    <meta
      property="og:url"
      content="https://suncodesapps.github.io/scrapjob/"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ScrapJob | Job Vacancies" />
    <meta
      name="twitter:description"
      content="A fictional job portal created for web scraping practice."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var r = sessionStorage.getItem('redirect');
          if (r) {
            sessionStorage.removeItem('redirect');
            if (
              r.startsWith('/') &&
              !r.includes('://') &&
              !r.startsWith('//')
            ) {
              window.history.replaceState(null, '', r);
              // dispara depois que o React montar
              window.addEventListener('load', function () {
                window.dispatchEvent(new PopStateEvent('popstate'));
              });
            }
          }
        } catch (e) {}
      })();
    </script>
    <script>
      const darkMode = localStorage.getItem('darkMode') === 'true'

      if (darkMode) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
